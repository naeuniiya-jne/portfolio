<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반도체 공정 모니터링 대시보드</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --border:#e2e8f0; --text:#1a202c; --sub:#64748b;
    --accent:#2563eb; --accent2:#0891b2; --good:#16a34a; --bad:#dc2626;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Pretendard,sans-serif;
    background:var(--bg); color:var(--text); padding:24px;
  }
  .wrap{max-width:1200px; margin:0 auto;}
  header{margin-bottom:20px;}
  header h1{font-size:22px; margin:0 0 4px;}
  header p{margin:0; color:var(--sub); font-size:13px;}

  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .filter-row{display:flex; flex-wrap:wrap; gap:18px; align-items:center;}
  .filter-group{display:flex; flex-direction:column; gap:6px;}
  .filter-group label{font-size:12px; color:var(--sub); font-weight:600;}
  .chip-group{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    padding:6px 12px; border:1px solid var(--border); border-radius:999px;
    background:#fff; font-size:13px; cursor:pointer; color:var(--text); user-select:none;
    transition:.12s;
  }
  .chip:hover{border-color:var(--accent);}
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .chip.bad.active{background:var(--bad); border-color:var(--bad);}
  .reset-btn{
    margin-left:auto; padding:7px 16px; border-radius:8px; border:1px solid var(--border);
    background:#fff; color:var(--sub); font-size:13px; cursor:pointer; font-weight:600;
  }
  .reset-btn:hover{background:#f1f5f9; color:var(--text);}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .kpi .label{font-size:12px; color:var(--sub); font-weight:600; margin-bottom:8px;}
  .kpi .value{font-size:26px; font-weight:700; line-height:1.2;}
  .kpi .sub{font-size:12px; color:var(--sub); margin-top:6px;}
  .kpi .value .unit{font-size:14px; font-weight:500; color:var(--sub); margin-left:2px;}

  .chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px;}
  .chart-card h3{margin:0 0 2px; font-size:14px;}
  .chart-card .desc{font-size:12px; color:var(--sub); margin-bottom:10px;}
  .chart-card canvas{width:100%; display:block; cursor:crosshair;}
  .full{grid-column:1 / -1;}

  #tooltip{
    position:fixed; pointer-events:none; background:rgba(17,24,39,.94); color:#fff;
    padding:8px 11px; border-radius:8px; font-size:12px; line-height:1.5; z-index:50;
    display:none; box-shadow:0 4px 12px rgba(0,0,0,.25); white-space:nowrap;
  }
  #tooltip b{font-size:12.5px;}

  footer{color:var(--sub); font-size:12px; text-align:center; margin-top:8px;}
  .empty-msg{color:var(--sub); font-size:13px; text-align:center; padding:40px 0;}

  @media (max-width:820px){
    .kpi-grid{grid-template-columns:repeat(2,1fr);}
    .chart-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>반도체 공정 모니터링 대시보드</h1>
    <p>데이터 출처: 11cha_secom_cleaned.csv · 설비별 공정 변수(챔버온도·압력·가스유량) 및 양/불량 현황 모니터링</p>
  </header>

  <div class="panel">
    <div class="filter-row">
      <div class="filter-group">
        <label>설비명</label>
        <div class="chip-group" id="equipChips"></div>
      </div>
      <div class="filter-group">
        <label>양품여부</label>
        <div class="chip-group" id="resultChips"></div>
      </div>
      <button class="reset-btn" id="resetBtn">필터 초기화</button>
    </div>
  </div>

  <div class="kpi-grid" id="kpiGrid"></div>

  <div class="chart-grid">
    <div class="panel chart-card">
      <h3>설비명별 건수</h3>
      <div class="desc">현재 필터 기준, 설비(Equipment)별 처리 건수</div>
      <canvas id="barChart" data-height="260"></canvas>
    </div>
    <div class="panel chart-card">
      <h3>챔버온도 분포</h3>
      <div class="desc">5℃ 구간별 건수 분포 (구간 경계는 전체 데이터 기준 고정)</div>
      <canvas id="histChart" data-height="260"></canvas>
    </div>
    <div class="panel chart-card full">
      <h3>측정일시 기준 챔버온도 추이</h3>
      <div class="desc">시간 순으로 정렬된 챔버온도(℃) 변화 · 점을 올리면 상세 값 표시</div>
      <canvas id="lineChart" data-height="280"></canvas>
    </div>
  </div>

  <footer>총 25건 · 원본 CSV 데이터를 브라우저 내에서 직접 집계 (서버/외부 라이브러리 미사용)</footer>
</div>

<div id="tooltip"></div>

<script>
/* ---------------- 원본 데이터 (11cha_secom_cleaned.csv) ---------------- */
const RAW = [
  {id:"LOT1001", dt:"2026-06-30 08:00", equip:"ETCH-01", temp:254.0, pressure:99.3,  gas:46.9, duration:66, result:"양품"},
  {id:"LOT1002", dt:"2026-06-30 09:00", equip:"ETCH-02", temp:252.2, pressure:105.1, gas:43.3, duration:57, result:"양품"},
  {id:"LOT1003", dt:"2026-06-30 10:00", equip:"CVD-01",  temp:251.9, pressure:90.4,  gas:39.8, duration:57, result:"양품"},
  {id:"LOT1004", dt:"2026-06-30 11:00", equip:"CVD-02",  temp:246.6, pressure:96.364, gas:42.9, duration:51, result:"양품"},
  {id:"LOT1005", dt:"2026-06-30 12:00", equip:"PVD-01",  temp:250.5, pressure:92.9,  gas:43.4, duration:60, result:"양품"},
  {id:"LOT1007", dt:"2026-06-30 14:00", equip:"ETCH-02", temp:249.9, pressure:94.7,  gas:47.5, duration:55, result:"양품"},
  {id:"LOT1008", dt:"2026-06-30 15:00", equip:"CVD-01",  temp:272.2, pressure:106.0, gas:44.4, duration:63, result:"양품"},
  {id:"LOT1011", dt:"2026-06-30 18:00", equip:"ETCH-01", temp:244.6, pressure:103.1, gas:48.1, duration:63, result:"양품"},
  {id:"LOT1012", dt:"2026-06-30 19:00", equip:"ETCH-02", temp:248.3, pressure:96.364, gas:40.5, duration:64, result:"불량"},
  {id:"LOT1013", dt:"2026-06-30 20:00", equip:"CVD-01",  temp:241.1, pressure:94.0,  gas:47.4, duration:65, result:"양품"},
  {id:"LOT1014", dt:"2026-06-30 21:00", equip:"CVD-02",  temp:241.7, pressure:99.6,  gas:47.9, duration:63, result:"양품"},
  {id:"LOT1016", dt:"2026-06-30 23:00", equip:"ETCH-01", temp:238.6, pressure:105.2, gas:47.7, duration:60, result:"양품"},
  {id:"LOT1017", dt:"2026-07-01 00:00", equip:"ETCH-02", temp:261.8, pressure:97.4,  gas:42.6, duration:57, result:"양품"},
  {id:"LOT1018", dt:"2026-07-01 01:00", equip:"CVD-01",  temp:254.0, pressure:105.8, gas:45.8, duration:61, result:"양품"},
  {id:"LOT1019", dt:"2026-07-01 02:00", equip:"CVD-02",  temp:250.8, pressure:104.8, gas:44.4, duration:58, result:"양품"},
  {id:"LOT1020", dt:"2026-07-01 03:00", equip:"PVD-01",  temp:260.2, pressure:98.5,  gas:37.0, duration:61, result:"양품"},
  {id:"LOT1022", dt:"2026-07-01 05:00", equip:"ETCH-02", temp:242.5, pressure:107.0, gas:44.9, duration:53, result:"양품"},
  {id:"LOT1023", dt:"2026-07-01 06:00", equip:"CVD-01",  temp:250.5, pressure:96.364, gas:44.4, duration:61, result:"불량"},
  {id:"LOT1024", dt:"2026-07-01 07:00", equip:"CVD-02",  temp:252.7, pressure:100.0, gas:47.3, duration:55, result:"양품"},
  {id:"LOT1025", dt:"2026-07-01 08:00", equip:"PVD-01",  temp:256.3, pressure:95.5,  gas:49.2, duration:54, result:"양품"},
  {id:"LOT1027", dt:"2026-07-01 10:00", equip:"ETCH-02", temp:250.8, pressure:97.5,  gas:40.3, duration:60, result:"양품"},
  {id:"LOT1028", dt:"2026-07-01 11:00", equip:"CVD-01",  temp:254.3, pressure:95.4,  gas:46.9, duration:59, result:"불량"},
  {id:"LOT1029", dt:"2026-07-01 12:00", equip:"CVD-02",  temp:243.7, pressure:98.4,  gas:47.4, duration:55, result:"양품"},
  {id:"LOT1030", dt:"2026-07-01 13:00", equip:"PVD-01",  temp:260.9, pressure:112.7, gas:44.0, duration:59, result:"양품"},
  {id:"LOT1003", dt:"2026-06-30 10:00", equip:"ETCH-01", temp:251.9, pressure:90.4,  gas:39.8, duration:57, result:"양품"},
];

const EQUIPS = [...new Set(RAW.map(r=>r.equip))].sort();
const RESULTS = ["양품","불량"];

/* 히스토그램 구간은 전체 데이터 기준으로 고정 (필터 간 비교 가능하도록) */
const TEMP_MIN = Math.min(...RAW.map(r=>r.temp));
const TEMP_MAX = Math.max(...RAW.map(r=>r.temp));
const BIN_WIDTH = 5;
const BIN_START = Math.floor(TEMP_MIN / BIN_WIDTH) * BIN_WIDTH;
const BIN_END = Math.ceil(TEMP_MAX / BIN_WIDTH) * BIN_WIDTH;
const BIN_EDGES = [];
for(let b=BIN_START; b<BIN_END; b+=BIN_WIDTH) BIN_EDGES.push(b);

/* ---------------- 필터 상태 ---------------- */
const state = {
  equip: new Set(EQUIPS),   // 전체 선택 = 필터 없음
  result: new Set(RESULTS),
};

/* ---------------- 필터 UI 생성 ---------------- */
const equipChipsEl = document.getElementById('equipChips');
const resultChipsEl = document.getElementById('resultChips');

function makeChip(container, value, groupKey, className){
  const chip = document.createElement('div');
  chip.className = 'chip' + (className? ' '+className : '');
  chip.textContent = value;
  chip.dataset.value = value;
  chip.addEventListener('click', ()=>{
    const set = state[groupKey];
    if(set.has(value)){
      if(set.size > 1) set.delete(value); // 최소 1개는 유지
    } else {
      set.add(value);
    }
    syncChips();
    render();
  });
  container.appendChild(chip);
}

// "전체" 칩
function makeAllChip(container, groupKey, allValues){
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.textContent = '전체';
  chip.dataset.all = '1';
  chip.addEventListener('click', ()=>{
    state[groupKey] = new Set(allValues);
    syncChips();
    render();
  });
  container.appendChild(chip);
}

makeAllChip(equipChipsEl, 'equip', EQUIPS);
EQUIPS.forEach(v=>makeChip(equipChipsEl, v, 'equip'));

makeAllChip(resultChipsEl, 'result', RESULTS);
RESULTS.forEach(v=>makeChip(resultChipsEl, v, 'result', v==='불량' ? 'bad' : ''));

function syncChips(){
  [[equipChipsEl,'equip',EQUIPS],[resultChipsEl,'result',RESULTS]].forEach(([el,key,all])=>{
    const isAll = state[key].size === all.length;
    el.querySelectorAll('.chip').forEach(chip=>{
      if(chip.dataset.all){
        chip.classList.toggle('active', isAll);
      } else {
        chip.classList.toggle('active', !isAll && state[key].has(chip.dataset.value));
      }
    });
  });
}
syncChips();

document.getElementById('resetBtn').addEventListener('click', ()=>{
  state.equip = new Set(EQUIPS);
  state.result = new Set(RESULTS);
  syncChips();
  render();
});

/* ---------------- 집계 ---------------- */
function getFiltered(){
  return RAW.filter(r => state.equip.has(r.equip) && state.result.has(r.result));
}
function avg(arr, key){
  if(arr.length===0) return 0;
  return arr.reduce((s,r)=>s+r[key],0)/arr.length;
}

/* ---------------- KPI 카드 ---------------- */
const kpiGrid = document.getElementById('kpiGrid');
function renderKPI(rows){
  const total = rows.length;
  const bad = rows.filter(r=>r.result==='불량').length;
  const good = total - bad;
  const badRate = total ? (bad/total*100) : 0;
  const avgTemp = avg(rows,'temp');
  const avgDur = avg(rows,'duration');

  kpiGrid.innerHTML = `
    <div class="kpi">
      <div class="label">전체 건수</div>
      <div class="value">${total}<span class="unit">건</span></div>
      <div class="sub">전체 25건 중 ${total}건 표시</div>
    </div>
    <div class="kpi">
      <div class="label">양품 / 불량</div>
      <div class="value" style="color:${bad>0?'var(--bad)':'var(--good)'}">${good} / ${bad}</div>
      <div class="sub">불량률 ${badRate.toFixed(1)}%</div>
    </div>
    <div class="kpi">
      <div class="label">평균 챔버온도</div>
      <div class="value">${total? avgTemp.toFixed(1):'-'}<span class="unit">℃</span></div>
      <div class="sub">범위 ${total? Math.min(...rows.map(r=>r.temp)).toFixed(1):'-'} ~ ${total? Math.max(...rows.map(r=>r.temp)).toFixed(1):'-'} ℃</div>
    </div>
    <div class="kpi">
      <div class="label">평균 공정시간</div>
      <div class="value">${total? avgDur.toFixed(1):'-'}</div>
      <div class="sub">범위 ${total? Math.min(...rows.map(r=>r.duration)):'-'} ~ ${total? Math.max(...rows.map(r=>r.duration)):'-'}</div>
    </div>
  `;
}

/* ---------------- 공통 캔버스 유틸 ---------------- */
const tooltip = document.getElementById('tooltip');
function showTooltip(x,y,html){
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
  tooltip.style.left = (x+14)+'px';
  tooltip.style.top = (y+14)+'px';
}
function hideTooltip(){ tooltip.style.display='none'; }

function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.parentElement.clientWidth;
  const cssHeight = parseInt(canvas.dataset.height || '260',10);
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  canvas.style.width = cssWidth+'px';
  canvas.style.height = cssHeight+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w:cssWidth, h:cssHeight};
}

const PAD = {left:48, right:16, top:16, bottom:36};

/* ---------------- 막대 차트: 설비명별 건수 ---------------- */
const barCanvas = document.getElementById('barChart');
let barHitRegions = [];
function drawBarChart(rows){
  const {ctx,w,h} = setupCanvas(barCanvas);
  ctx.clearRect(0,0,w,h);
  barHitRegions = [];

  const counts = EQUIPS.map(eq => rows.filter(r=>r.equip===eq).length);
  const total = rows.length;
  const maxVal = Math.max(1, ...counts);
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;
  const barSlot = plotW / EQUIPS.length;
  const barWidth = barSlot * 0.55;

  // y축 그리드 + 라벨
  ctx.strokeStyle = '#e2e8f0'; ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const val = Math.round(maxVal * i/steps);
    const y = PAD.top + plotH - (val/maxVal)*plotH;
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(w-PAD.right,y); ctx.stroke();
    ctx.fillText(val, PAD.left-8, y);
  }
  // y축 제목
  ctx.save();
  ctx.translate(14, PAD.top+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillText('건수', 0, 0);
  ctx.restore();

  EQUIPS.forEach((eq,i)=>{
    const val = counts[i];
    const barH = (val/maxVal)*plotH;
    const x = PAD.left + i*barSlot + (barSlot-barWidth)/2;
    const y = PAD.top + plotH - barH;
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(x,y,barWidth,barH);
    // x축 라벨
    ctx.fillStyle = '#334155'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(eq, x+barWidth/2, PAD.top+plotH+8);
    // 값 라벨
    ctx.fillStyle = '#1a202c'; ctx.textBaseline='bottom';
    ctx.fillText(val, x+barWidth/2, y-4);

    barHitRegions.push({
      x1:x, y1:PAD.top, x2:x+barWidth, y2:PAD.top+plotH,
      html:`<b>${eq}</b><br>건수: ${val}건<br>비율: ${total? (val/total*100).toFixed(1):'0.0'}%`
    });
  });
}

barCanvas.addEventListener('mousemove', e=>{
  const rect = barCanvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const hit = barHitRegions.find(r=> mx>=r.x1 && mx<=r.x2 && my>=r.y1 && my<=r.y2);
  if(hit) showTooltip(e.clientX,e.clientY,hit.html); else hideTooltip();
});
barCanvas.addEventListener('mouseleave', hideTooltip);

/* ---------------- 히스토그램: 챔버온도 분포 ---------------- */
const histCanvas = document.getElementById('histChart');
let histHitRegions = [];
function drawHistogram(rows){
  const {ctx,w,h} = setupCanvas(histCanvas);
  ctx.clearRect(0,0,w,h);
  histHitRegions = [];

  const counts = BIN_EDGES.map(edge => rows.filter(r=> r.temp>=edge && r.temp<edge+BIN_WIDTH).length);
  const total = rows.length;
  const maxVal = Math.max(1, ...counts);
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;
  const slot = plotW / BIN_EDGES.length;
  const barWidth = slot * 0.85;

  ctx.strokeStyle = '#e2e8f0'; ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  const steps = 4;
  for(let i=0;i<=steps;i++){
    const val = Math.round(maxVal*i/steps);
    const y = PAD.top + plotH - (val/maxVal)*plotH;
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(w-PAD.right,y); ctx.stroke();
    ctx.fillText(val, PAD.left-8, y);
  }
  ctx.save();
  ctx.translate(14, PAD.top+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillText('건수', 0, 0);
  ctx.restore();

  BIN_EDGES.forEach((edge,i)=>{
    const val = counts[i];
    const barH = (val/maxVal)*plotH;
    const x = PAD.left + i*slot + (slot-barWidth)/2;
    const y = PAD.top + plotH - barH;
    ctx.fillStyle = '#0891b2';
    ctx.fillRect(x,y,barWidth,barH);
    ctx.fillStyle = '#334155'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font = '10px sans-serif';
    ctx.fillText(`${edge}`, x+barWidth/2, PAD.top+plotH+8);
    if(val>0){
      ctx.fillStyle = '#1a202c'; ctx.textBaseline='bottom'; ctx.font='11px sans-serif';
      ctx.fillText(val, x+barWidth/2, y-4);
    }
    histHitRegions.push({
      x1:x, y1:PAD.top, x2:x+barWidth, y2:PAD.top+plotH,
      html:`<b>${edge}℃ ~ ${edge+BIN_WIDTH}℃</b><br>건수: ${val}건<br>비율: ${total? (val/total*100).toFixed(1):'0.0'}%`
    });
  });
  // x축 제목
  ctx.fillStyle = '#64748b'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('챔버온도 구간(℃)', PAD.left+plotW/2, h-6);
}

histCanvas.addEventListener('mousemove', e=>{
  const rect = histCanvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const hit = histHitRegions.find(r=> mx>=r.x1 && mx<=r.x2 && my>=r.y1 && my<=r.y2);
  if(hit) showTooltip(e.clientX,e.clientY,hit.html); else hideTooltip();
});
histCanvas.addEventListener('mouseleave', hideTooltip);

/* ---------------- 선 그래프: 시간대별 챔버온도 추이 ---------------- */
const lineCanvas = document.getElementById('lineChart');
let linePoints = [];
function drawLineChart(rows){
  const {ctx,w,h} = setupCanvas(lineCanvas);
  ctx.clearRect(0,0,w,h);
  linePoints = [];

  const sorted = [...rows].sort((a,b)=> new Date(a.dt.replace(' ','T')) - new Date(b.dt.replace(' ','T')));
  const plotW = w - PAD.left - PAD.right;
  const plotH = h - PAD.top - PAD.bottom;

  if(sorted.length===0){
    ctx.fillStyle='#94a3b8'; ctx.font='13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('선택한 조건에 해당하는 데이터가 없습니다.', w/2, h/2);
    return;
  }

  const vals = sorted.map(r=>r.temp);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const yMin = Math.floor((minV-2)/5)*5, yMax = Math.ceil((maxV+2)/5)*5;

  ctx.strokeStyle = '#e2e8f0'; ctx.fillStyle = '#64748b';
  ctx.font = '11px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = yMin + (yMax-yMin)*i/steps;
    const y = PAD.top + plotH - (i/steps)*plotH;
    ctx.beginPath(); ctx.moveTo(PAD.left,y); ctx.lineTo(w-PAD.right,y); ctx.stroke();
    ctx.fillText(val.toFixed(0), PAD.left-8, y);
  }
  ctx.save();
  ctx.translate(14, PAD.top+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillText('챔버온도(℃)', 0, 0);
  ctx.restore();

  const n = sorted.length;
  const stepX = n>1 ? plotW/(n-1) : 0;
  const coords = sorted.map((r,i)=>{
    const x = n>1 ? PAD.left + i*stepX : PAD.left+plotW/2;
    const y = PAD.top + plotH - ((r.temp-yMin)/(yMax-yMin))*plotH;
    return {x,y,r};
  });

  ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 2; ctx.beginPath();
  coords.forEach((c,i)=> i===0? ctx.moveTo(c.x,c.y) : ctx.lineTo(c.x,c.y));
  ctx.stroke();

  coords.forEach(c=>{
    ctx.fillStyle = c.r.result==='불량' ? '#dc2626' : '#2563eb';
    ctx.beginPath(); ctx.arc(c.x,c.y,3.5,0,Math.PI*2); ctx.fill();
    linePoints.push({x:c.x,y:c.y,r:c.r});
  });

  // x축 라벨: 처음/끝 및 일부 간격만 표시(겹침 방지)
  ctx.fillStyle='#64748b'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='top';
  const labelEvery = Math.max(1, Math.ceil(n/6));
  coords.forEach((c,i)=>{
    if(i%labelEvery===0 || i===n-1){
      const label = c.r.dt.slice(5).replace(' ','\n');
      const [d,t] = label.split('\n');
      ctx.fillText(d, c.x, PAD.top+plotH+6);
      ctx.fillText(t, c.x, PAD.top+plotH+18);
    }
  });
}

lineCanvas.addEventListener('mousemove', e=>{
  const rect = lineCanvas.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  let nearest=null, best=Infinity;
  linePoints.forEach(p=>{
    const d = Math.hypot(p.x-mx, p.y-my);
    if(d<best){best=d; nearest=p;}
  });
  if(nearest && best<20){
    showTooltip(e.clientX,e.clientY,
      `<b>${nearest.r.id}</b> (${nearest.r.equip})<br>${nearest.r.dt}<br>챔버온도: ${nearest.r.temp.toFixed(1)}℃<br>판정: ${nearest.r.result}`);
  } else hideTooltip();
});
lineCanvas.addEventListener('mouseleave', hideTooltip);

/* ---------------- 렌더링 ---------------- */
function render(){
  const rows = getFiltered();
  renderKPI(rows);
  drawBarChart(rows);
  drawHistogram(rows);
  drawLineChart(rows);
}

window.addEventListener('resize', ()=>{
  clearTimeout(window.__rz);
  window.__rz = setTimeout(render, 120);
});

render();
</script>
</body>
</html>
